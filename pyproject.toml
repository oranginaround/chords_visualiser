[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "j6-chords"
version = "0.1.0"
description = "Real-time MIDI chord reader GUI for Roland J-6 and other MIDI devices"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "orangemax" }
]
license = { text = "MIT" }
keywords = ["midi", "chords", "pygame", "roland", "j6"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
  "mido>=1.3.0",
  "python-rtmidi>=1.5.0",
  "pygame-ce>=2.5.6",
]

[project.scripts]
j6-chords-gui = "j6_chords.app:main"

[dependency-groups]
dev = [
  "build>=1.2.2.post1",
  "twine>=5.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/j6_chords"]
